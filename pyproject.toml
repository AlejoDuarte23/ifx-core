[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "ifx-core"
version = "0.1.0"
description = "IFC extraction and geometry for Rust, Python, and WebAssembly"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
authors = [{ name = "IFX Contributors" }]
keywords = ["ifc", "bim", "spatial", "relationships", "materials", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ifcopenshell==0.8.5; python_version >= '3.10' and python_version < '3.15'",
]

[project.urls]
Repository = "https://github.com/AlejoDuarte23/ifx-core"
Upstream = "https://github.com/LTplus-AG/ifc-lite"

[dependency-groups]
dev = [
    "ifcopenshell==0.8.5; python_version >= '3.10' and python_version < '3.15'",
    "maturin>=1.9,<2.0",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.maturin]
module-name = "ifx_core"
features = ["python", "pyo3/extension-module"]
include = [
  { path = "ifx_core.pyi", format = "wheel" },
  { path = "LICENSE", format = "wheel" },
  { path = "ACKNOWLEDGEMENTS.md", format = "wheel" },
  { path = "UPSTREAM_SOURCE.json", format = "sdist" },
  { path = "crates/**/*", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "corpus: tests that download the pinned VIKTOR IFC corpus",
  "integration: tests requiring an external IFC model and IfcOpenShell",
]
